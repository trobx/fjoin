url: https://trobx.github.io/fjoin

template:
  bootstrap: 5
  bslib:
    primary: "#447099"          # links and hover muted blue
    navbar-light-bg: "#f8f9fa"  # navbar background pale grey
    base_font: {google: "Source Sans Pro"}
    heading_font: {google: "Source Sans Pro"}
    code_font: {google: "Fira Code"}
  includes:
    in_header: |
      <style>

      /* navbar lower border (not in Bootstrap by default) */
      nav.navbar.navbar-expand-lg {
        border-bottom: 1px solid #e5e5e5 !important;
      }

      /* Main text near-black */
      body {
        color: #222222;
        #color: #003B4F;
      }

      /* Headings: slightly softer grey */
      h1, h2, h3, h4, h5, h6 {
        color: #333333;
      }

      /* Inline code should match text color */
      p code, li code {
        color: inherit !important;
        font-family: "Fira Code", monospace; /* keep code font for clarity */
        font-size: 0.9em; /* optional: make it slightly smaller */
      }

      /* Make code slightly smaller */
      pre code, code {
        font-size: 0.9em; /* adjust as needed (0.85em for even smaller) */
      }

      /* Style for package names */
      .pkgname {
        color: #3F6E6E;       /* grey-teal */
        font-weight: 500;     /* medium */
        font-family: inherit; /* match surrounding text */
      }

      </style>

home:
  readme: README.md
  sidebar:
    structure:
      - links
      - license
      - citation
      - authors
      - dev       # badges

articles:
  - title: "Performance"
    contents:
      - fjoin-performance

reference:

  - title: The `fjoin_*` family
    desc: >
      Fast data frame joins in a familiar `x`/`y` style
  - subtitle: True joins
    contents:
    - fjoin_inner
    - fjoin_left
    - fjoin_right
    - fjoin_full
  - subtitle: Semi-joins
    contents:
    - fjoin_left_semi
    - fjoin_right_semi
  - subtitle: Anti-joins
    contents:
    - fjoin_left_anti
    - fjoin_right_anti
  - subtitle: Cross-joins
    contents:
    - fjoin_cross

  - title: The `dtjoin*` family
    desc: >
      An extended interface for `DT[i]`-style <span style="color:#666666; font-weight:bold;">data.table</span> joins
  - subtitle: True joins
    contents:
    - dtjoin
  - subtitle: Semi-joins
    contents:
    - dtjoin_semi
  - subtitle: Anti-joins
    contents:
    - dtjoin_anti
  - subtitle: Cross joins
    contents:
    - dtjoin_cross
